<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Feedback — TYPE/15</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body class="form-page">
    <main class="form-shell" data-reveal>
        <section class="form-intro">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">+</span>
                <span>TYPE / 15</span>
            </a>
            <div>
                <p class="eyebrow">FEEDBACK / OPEN CHANNEL</p>
                <h1>TELL ME<br>WHAT <span>HIT.</span></h1>
            </div>
            <p class="result-label">SHORT, DIRECT, USEFUL.</p>
        </section>

        <form class="form-panel" method="POST" action="{{ url_for('feedback') }}">
            <div class="question-meta">
                <strong>02 FIELDS</strong>
                <span>YOUR INPUT</span>
            </div>

            <div class="field">
                <label for="name">01 / YOUR NAME</label>
                <input type="text" name="name" id="name" autocomplete="name" placeholder="Type your name" required>
            </div>

            <div class="field">
                <label for="message">02 / YOUR MESSAGE</label>
                <textarea name="message" id="message" placeholder="What worked? What felt off?" required></textarea>
            </div>

            <button class="primary-action" type="submit">SEND FEEDBACK <span>↗</span></button>
        </form>
    </main>
</body>
</html>
